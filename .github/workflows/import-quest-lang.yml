name: 任务书搬运（一次性）

# 把上一个仓库已有的中文任务书按「英文原文逐字节一致」搬进本仓库。
# 迁移期跑一次就够；搬完这条流水线与 scripts/import_quest_lang.py 一起退役。
#
# 三份输入，身份都由构造保证，不靠令牌也不靠人记：
#   中文出货树  clone 上一个仓库（公开），用**它自己的** fetch_pack.py 取它那一版的
#               官方 overrides，再用**它自己的** gen_quest_lang_patches.py 把它的 delta
#               并进上游的 zh_cn——这就是它的出货树。
#               **不取游戏目录**：那份是 ftbquestslangsplitter 运行时按哈希序合并的，
#               值的形态与键的有无都会变。
#   源英文      同一份 overrides 里的 en_us。
#   目标英文    本仓库的 fetch_pack.py 取本包 overrides 里的 en_us。
# 两支 fetch_pack.py 的 PROJECT 各钉在各自仓库，都会核 overrides 指纹，拿错包当场红。
#
# 产物上传成 artifact、末尾 exit 1：搬运结果是译文，机器只负责算，人负责过目并提交。

on:
  workflow_dispatch:
    inputs:
      atm10_version:
        description: '取上一个仓库哪个在册版本（留空＝它在册的最新版）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SRC_REPO: chiba233/atm10-zh-cn
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 摊出上一个仓库的中文任务书出货树
        env:
          WANT: ${{ github.event.inputs.atm10_version }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/$SRC_REPO.git" build/srcrepo
          cd build/srcrepo
          if [ -n "$WANT" ]; then SRC_VER="$WANT"; else
            SRC_VER=$(ls -d versions/[0-9]* | xargs -n1 basename | sort -V | tail -1); fi
          echo "源整合包版本 $SRC_VER"
          # 它自己的 fetch_pack.py（PROJECT 钉在它那边）取它那一版的官方 overrides；
          # 指纹要与它仓库里记的那份对得上，对不上当场红。
          python3 scripts/fetch_pack.py "$SRC_VER" ../srcpack --no-jars
          # 它的 delta 摊进一棵临时树，再用它自己的生成器并进上游 zh_cn
          mkdir -p ../zhtree/config
          cp -R src/config/. ../zhtree/config/
          python3 scripts/gen_quest_lang_patches.py ../srcpack ../zhtree "$SRC_VER"
          cd ../..
          ZH=build/zhtree/config/ftbquests/quests/lang/zh_cn
          [ -d "$ZH" ] || { echo "❌ 没摊出 $ZH"; exit 1; }
          echo "中文出货树 $ZH（$(find "$ZH" -name '*.snbt' | wc -l) 个 .snbt）"
          echo "ZH_TREE=$ZH" >> "$GITHUB_ENV"
          echo "SRC_PACK=build/srcpack" >> "$GITHUB_ENV"

      - name: 取本包整合包的官方 en_us
        run: |
          set -euo pipefail
          VER=$(ls -d versions/[0-9]* | xargs -n1 basename | sort -V | tail -1)
          echo "本包整合包版本 $VER"
          python3 scripts/fetch_pack.py "$VER" build/dstpack --no-jars
          echo "DST_PACK=build/dstpack" >> "$GITHUB_ENV"

      - name: 搬运（判据：英文原文逐字节一致）
        run: python3 scripts/import_quest_lang.py "$ZH_TREE" "$SRC_PACK" "$DST_PACK"

      - uses: actions/upload-artifact@v7
        with:
          name: quest-lang-import
          path: |
            src/config/ftbquests/
            build/quest_lang_review.txt
          retention-days: 30

      - name: 搬完没入库就到此为止
        run: |
          echo "❌ 搬运结果尚未提交进仓库。"
          echo "   下载 artifact「quest-lang-import」，核对后提交 src/config/ftbquests/，"
          echo "   build/quest_lang_review.txt 里那批「原文改过」逐条人工处理。"
          exit 1
